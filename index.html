<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECOLOIMP</title>
<link rel="stylesheet" href="styles.css">
<style>
/* ESTO ARREGLA TU MENU EN CELULAR AUNQUE styles.css ESTE MALO */
#menuToggle{display:none;font-size:32px;background:none;border:none;cursor:pointer}
@media(max-width:900px){
  #menuToggle{display:block!important}
  #mainNav{display:none!important;position:fixed!important;top:60px;left:0;right:0;background:#fff;flex-direction:column;padding:20px;gap:15px;z-index:99999;box-shadow:0 10px 20px rgba(0,0,0,.2)}
  #mainNav.open{display:flex!important}
}
.page-section{display:none}.page-section.active{display:block}
</style>
</head>
<body>
<header class="site-header" style="background:#fff;position:sticky;top:0;z-index:999">
  <div class="header-inner" style="display:flex;justify-content:space-between;align-items:center;padding:10px 15px;max-width:1200px;margin:auto">
    <a href="#bienvenido" data-section="bienvenido"><img src="assets/logo.jpg" alt="logo" style="height:40px"></a>
    <button id="menuToggle" type="button">☰</button>
    <nav id="mainNav" class="main-nav" style="display:flex;gap:15px">
      <a href="#bienvenido" data-section="bienvenido">Bienvenido</a>
      <a href="#carga" data-section="carga">Carga</a>
      <a href="#visita" data-section="visita">Visita Técnica</a>
      <a href="#conteo" data-section="conteo">Conteo</a>
      <a href="#inventario" data-section="inventario">Inventarios</a>
      <a href="#contacto" data-section="contacto">Contacto</a>
    </nav>
  </div>
</header>
<main class="container" style="padding:15px;max-width:1200px;margin:auto">
  <section id="bienvenido" class="page-section active"><h1>ECOLOIMP - Gestión técnica e inventarios</h1><p>Clientes: <b id="statClientes">0</b> | Impresoras: <b id="statImpresoras">0</b></p></section>
  <section id="carga" class="page-section"><h2>Carga de archivos</h2>
    <div><input type="file" data-file-type="clientes"> <span id="fileClientes"></span></div>
    <div><input type="file" data-file-type="impresoras"> <span id="fileImpresoras"></span></div>
    <div><input type="file" data-file-type="tecnicos"> <span id="fileTecnicos"></span></div>
    <div><input type="file" data-file-type="bodegas"> <span id="fileBodegas"></span></div>
    <div><input type="file" data-file-type="productos"> <span id="fileProductos"></span></div>
    <div><input type="file" data-file-type="inventarios"> <span id="fileInventarios"></span></div>
    <div><input type="file" data-file-type="trabajos"> <span id="fileTrabajos"></span></div>
  </section>
  <section id="visita" class="page-section">
    <h2>Visita Técnica</h2>
    <input id="vtClienteFilter" placeholder="Filtrar cliente"> <select id="vtCliente"></select><br><br>
    <input id="vtPrinterFilter" placeholder="Filtrar impresora">
    <table><tbody id="vtPrinterBody"></tbody></table>
    <div id="vtSelectedPrinterStatus">Ninguna impresora seleccionada</div>
    <div id="vtPrinterDetails"></div><br>
    <select id="vtTecnico"></select> <select id="vtTrabajo"></select> <select id="vtTipo"><option>Preventiva</option><option>Correctiva</option></select> <select id="vtEstado"><option>Finalizada</option><option>Pendiente</option></select><br><br>
    <input id="vtFecha" type="date"> <input id="vtHora" type="time"><br><br>
    <input id="vtEmail" type="email" placeholder="email cliente" style="width:100%"><br><br>
    <textarea id="vtDetalle" placeholder="Detalle trabajo" style="width:100%;height:80px"></textarea><br><br>
    <canvas id="vtFirmaCanvas" width="600" height="200" style="border:1px solid #000;width:100%"></canvas><br>
    <button type="button" id="btnFirmaLimpiar">Limpiar firma</button> <span id="firmaStatus">Sin firma</span><br><br>
    <input id="vtNombreFirma" placeholder="Nombre quien firma" style="width:100%"><br><br>
    <button id="btnVisitaGuardar">Guardar y Gmail</button> <button id="btnVisitaGmail">Solo Gmail</button>
    <div id="vtMessage" hidden style="padding:10px;margin-top:10px;background:#fee"></div>
    <input type="hidden" id="pgCorreo">
  </section>
  <section id="conteo" class="page-section"><h2>Conteo</h2></section>
  <section id="inventario" class="page-section"><h2>Inventarios</h2></section>
  <section id="contacto" class="page-section"><h2>Contacto: administracion@ecoloimp.com</h2></section>
</main>
<script>
// MENU QUE FUNCIONA AUN SIN APP.JS
document.addEventListener('DOMContentLoaded',function(){
  const btn=document.getElementById('menuToggle');
  const nav=document.getElementById('mainNav');
  btn.addEventListener('click',function(e){
    e.stopPropagation();
    nav.classList.toggle('open');
    if(window.innerWidth<=900){
      nav.style.display=nav.classList.contains('open')?'flex':'none';
    }
    btn.textContent=nav.classList.contains('open')?'✕':'☰';
  });
  document.querySelectorAll('[data-section]').forEach(function(a){
    a.addEventListener('click',function(e){
      e.preventDefault();
      const id=a.dataset.section;
      document.querySelectorAll('.page-section').forEach(s=>s.classList.remove('active'));
      const sec=document.getElementById(id);
      if(sec) sec.classList.add('active');
      nav.classList.remove('open');
      if(window.innerWidth<=900) nav.style.display='none';
      btn.textContent='☰';
      history.replaceState(null,'','#'+id);
    });
  });
});
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
